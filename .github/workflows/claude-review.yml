name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  # The merge rating covers the commits that were reviewed, so a new push removes it.
  clear-merge-label:
    name: Clear merge rating
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for t in easy normal careful; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge:%20$t" >/dev/null 2>&1 || true
          done

  review:
    name: Claude review
    # Fork PRs get no secrets, and bot PRs and bot-triggered events (dependabot, changesets) are skipped.
    if: >-
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A second run on the same PR waits, then skips findings the first one posted.
    concurrency: claude-review-${{ github.event.pull_request.number }}
    env:
      # Strips the Claude token and runner secrets from the reviewer's shell and runs it in its own PID namespace.
      # The job's GITHUB_TOKEN stays available so the reviewer can use gh.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Claude Code needs bubblewrap and socat for the isolation above, and refuses to start without them.
      - name: Install shell isolation
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat && break
            sleep 5
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Packages let the reviewer typecheck, lint, run tests, and read library source. Same setup as lint.yml.
      - uses: upstash/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      # A failed install (say, a lockfile the PR forgot to update) still gets a review, without packages.
      - name: Install packages
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Fetch the PR for the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          {
            gh pr view "$PR" -R "$GITHUB_REPOSITORY"
            printf '\n## Comments\n'
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | \"\n### \(.user.login)\n\(.body)\""
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq ".[] | select(.body != \"\") | \"\n### \(.user.login) (review)\n\(.body)\""
          } > pr.md
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq ".[] | {user: .user.login, path, line, body}" > review-comments.jsonl
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" -H "Accept: application/vnd.github.diff" > pr.diff ||
            { echo "The diff is too large to fetch. Changed files:"; gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'; } > pr.diff

      - id: review
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}. The repository is checked out at the PR's head. In ${{ runner.temp }}/pr are the PR's title, description and comments (`pr.md`), its diff (`pr.diff`), and its earlier inline review comments (`review-comments.jsonl`). The checkout and the diff are at commit ${{ github.event.pull_request.head.sha }}, and the checkout has full git history. Packages are normally installed in `node_modules` (if it is missing, the install failed), so you can run the type checker, linter and tests (`pnpm tsc --noEmit`, `pnpm lint`, `pnpm test`) and read library source in `node_modules`.

            A bug counts if any caller or user of the code could hit it, even when no code in the repo does today.

            1. Spawn a fresh `bug-finder` subagent and ask it for bugs this PR introduces. Tell it where the files are and what counts as a bug.
            2. Check each finding yourself: read the code and the installed packages' source, and run things when that settles it. Drop the ones you can show are wrong, pre-existing, or style, or that an earlier review comment on this PR already raised. Keep the ones you still can't settle as questions, unless the PR description already says the behavior is intended.
            3. Post each kept finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`, `commit_id: ${{ github.event.pull_request.head.sha }}`) on a RIGHT-side line inside a diff hunk, the closest one to the problem. For a bug: its severity, the scenario that breaks, and the fix; use a suggestion block only when committing it fixes the issue entirely. For a question: start with "Question:", then say what breaks if the assumption is wrong and what would confirm it. With no kept findings, post nothing.
            4. Rate how much care merging this PR needs, as its `merge` field: `easy` for docs, copy, styling, tests, internal tooling, or additive changes behind a flag, with no findings posted; `careful` for login and auth, billing and payments, team roles and permissions, deleting data, CI workflows, or any high-severity finding; `normal` for everything else. Put the deciding reason in one sentence in `reason`.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --json-schema '{"type":"object","properties":{"merge":{"type":"string","enum":["easy","normal","careful"]},"reason":{"type":"string"}},"required":["merge","reason"],"additionalProperties":false}'
            --add-dir ${{ runner.temp }}/pr
            --allowedTools "Bash,Agent,mcp__github_inline_comment__create_inline_comment"
            --agents '{"bug-finder":{"description":"Finds bugs a pull request introduces and reports them; posts nothing.","prompt":"You review a pull request by another author and report findings to the agent that asked. You cannot post to GitHub.","tools":["Read","Bash"],"model":"opus","effort":"high"}}'

      # Labels the PR "merge: easy|normal|careful" (risk tiers as in Anthropic's own review flow) and writes the reason
      # to the job summary. The rating comes from the model, so it is read as data and never put into the script.
      - name: Label how easy the PR is to merge
        if: steps.review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          merge=$(jq -r .merge <<<"$OUT")
          case "$merge" in easy) color=0e8a16 ;; normal) color=fbca04 ;; careful) color=d93f0b ;; *) exit 0 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/labels/merge:%20$merge" >/dev/null 2>&1 ||
            gh api "repos/$GITHUB_REPOSITORY/labels" -f name="merge: $merge" -f color=$color -f description="How much care merging this PR needs, rated by the Claude review" >/dev/null || true
          for old in easy normal careful; do
            [ "$old" = "$merge" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge:%20$old" >/dev/null 2>&1 || true
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=merge: $merge" >/dev/null
          { echo "**Merge: $merge**"; echo; jq -r .reason <<<"$OUT"; } >> "$GITHUB_STEP_SUMMARY"
