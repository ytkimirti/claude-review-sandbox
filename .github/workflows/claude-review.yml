name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled]

jobs:
  # Decides whether and how to review. A PR gets a full review when it opens, leaves draft or is reopened, and when
  # someone adds the `claude-review` label, which is removed again right away. A push gets a re-review of its new
  # commits only.
  gate:
    if: github.event.action != 'labeled' || github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run: ${{ steps.g.outputs.run }}
      pr: ${{ steps.g.outputs.pr }}
      head: ${{ steps.g.outputs.head }}
      base: ${{ steps.g.outputs.base }}
      full: ${{ steps.g.outputs.full }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          head=$(jq -r .head.sha <<<"$pr")
          run=true full=true
          [ "$ACTION" = labeled ] && { gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/claude-review" >/dev/null 2>&1 || true; }
          # Fork PRs never get the secrets. Bot PRs and bot events (dependabot, changesets) are skipped, and so are drafts
          # unless the label asked for a review. A push that is no longer the head has a newer run.
          { [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" ] || [ "$SENDER_TYPE" = Bot ] || [ "$(jq -r .user.type <<<"$pr")" = Bot ] ||
            { [ "$(jq -r .draft <<<"$pr")" = true ] && [ "$ACTION" != labeled ]; } || [ "$head" != "$EVENT_HEAD" ]; } && run=false
          if [ "$ACTION" = synchronize ]; then
            full=false
            # The merge rating covers the reviewed commits only. A reviewed push gets a new one from its re-review; a push
            # that won't be reviewed (draft, bot) loses it. A stale push leaves it to the newer push's run.
            if [ "$run" = false ] && [ "$head" = "$EVENT_HEAD" ]; then
              for t in easy normal careful; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge:%20$t" >/dev/null 2>&1 || true
              done
            fi
          fi
          { echo "run=$run"; echo "pr=$PR"; echo "head=$head"; echo "base=$(jq -r .base.sha <<<"$pr")"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      result: ${{ steps.review.outputs.structured_output || steps.scope.outputs.carry }}
    # One review per PR at a time; a newer request waits and replaces any older waiting one, so a burst of pushes
    # costs at most two reviews. Runs that won't review get their own group so they never displace a waiting review.
    concurrency: claude-review-${{ needs.gate.outputs.run == 'true' && needs.gate.outputs.pr || github.run_id }}
    env:
      # Strips the Claude token and runner secrets from the reviewer's shell and runs it in its own PID namespace.
      # The job's GITHUB_TOKEN stays available so the reviewer can use gh.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      # Writes the PR's text, diff and earlier review threads for the reviewer. On a push it also finds the last
      # reviewed commit (marked by the "Claude review: reviewed" status) and writes the PR's own commits since then,
      # leaving out merges and commits from the base branch; with none, the rest of the job is skipped. Without a
      # reviewed commit, or after a rebase that dropped it, the review covers the whole PR.
      - name: Fetch the PR for the reviewer
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          BASE: ${{ needs.gate.outputs.base }}
          HEAD: ${{ needs.gate.outputs.head }}
          FULL: ${{ needs.gate.outputs.full }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          {
            gh pr view "$PR" -R "$GITHUB_REPOSITORY"
            printf '\n## Comments\n'
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | \"\n### \(.user.login)\n\(.body)\""
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq ".[] | select(.body != \"\") | \"\n### \(.user.login) (review)\n\(.body)\""
          } > pr.md
          gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
              reviewThreads(last: 100) { nodes { isResolved path line comments(first: 30) { nodes { databaseId author { login } body } } } } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | {id: .comments.nodes[0].databaseId, resolved: .isResolved, path, line, comments: [.comments.nodes[] | {user: .author.login, body}]}' > review-threads.jsonl
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" -H "Accept: application/vnd.github.diff" > pr.diff ||
            { echo "The diff is too large to fetch. Changed files:"; gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'; } > pr.diff
          prev="" skip=false
          if [ "$FULL" != true ]; then
            for sha in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].sha' | tac); do
              if gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '.statuses[].context' | grep -qx 'Claude review: reviewed'; then prev=$sha; break; fi
            done
            [ -n "$prev" ] && ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$prev" "$HEAD" && prev=""
          fi
          if [ -n "$prev" ]; then
            # Merges show only what they changed beyond a clean merge (conflict resolutions, extra edits), so merging
            # the base branch adds nothing. A base commit missing from the checkout makes this fail; then review it all.
            if ! git -C "$GITHUB_WORKSPACE" log -p --remerge-diff --reverse "$HEAD" "^$prev" "^$BASE" > new.diff; then
              prev=""
            elif [ -z "$(git -C "$GITHUB_WORKSPACE" log -p --remerge-diff --format= "$HEAD" "^$prev" "^$BASE")" ]; then
              # Nothing new from the PR (a clean merge of the base, or a push back to a reviewed commit): carry the last
              # rating over to this commit.
              skip=true
              merge=$(gh api "repos/$GITHUB_REPOSITORY/commits/$prev/status" --jq '.statuses[] | select(.context == "Claude review: reviewed") | .description' | sed -n 's/.*merge: //p' | head -1)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              [ -z "$merge" ] || { echo "carry=$(jq -nc --arg m "$merge" --arg p "$prev" '{merge: $m, reason: "No new changes from the PR since the review of \($p); rating carried over.", fixed: []}')" >> "$GITHUB_OUTPUT"; }
            fi
          fi
          # The merge rating covers the reviewed commits only; this review sets a new one.
          if [ "$skip" = false ]; then
            for t in easy normal careful; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge:%20$t" >/dev/null 2>&1 || true
            done
          fi
          [ -z "$prev" ] || echo "focus=This is a re-review after new commits. The last review covered commit $prev, and \`new.diff\` in the same folder has the PR's own commits since then, with their patches. Ask for bugs the new changes introduce, with the whole PR as context." >> "$GITHUB_OUTPUT"

      # Claude Code needs bubblewrap and socat for the isolation above, and refuses to start without them.
      - name: Install shell isolation
        if: steps.scope.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap socat && break
            sleep 5
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Packages let the reviewer typecheck, lint, run tests, and read library source. Same setup as lint.yml.
      - uses: upstash/action-setup@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          version: 11.1.3
          run_install: false
      # No package cache: a comment-triggered run would save it where the default branch's runs restore it from.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          node-version: 22
      # A failed install (say, a lockfile the PR forgot to update) still gets a review, without packages.
      - name: Install packages
        if: steps.scope.outputs.skip != 'true'
        continue-on-error: true
        # Without install scripts, so no PR code runs outside Claude's sandbox.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - id: review
        if: steps.scope.outputs.skip != 'true'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ needs.gate.outputs.pr }}. The repository is checked out at the PR's head. In ${{ runner.temp }}/pr are the PR's title, description and comments (`pr.md`), its diff (`pr.diff`), and its earlier inline review threads (`review-threads.jsonl`). The checkout and the diff are at commit ${{ needs.gate.outputs.head }}, and the checkout has full git history. Packages are normally installed in `node_modules` (if it is missing, the install failed), so you can run the type checker, linter and tests (`pnpm tsc --noEmit`, `pnpm lint`, `pnpm test`) and read library source in `node_modules`.
            ${{ steps.scope.outputs.focus }}
            A bug counts if any caller or user of the code could hit it, even when no code in the repo does today.

            1. Spawn a fresh `bug-finder` subagent and ask it for bugs this PR introduces. Tell it where the files are and what counts as a bug.
            2. Check each finding yourself: read the code and the installed packages' source, and run things when that settles it. Drop the ones you can show are wrong, pre-existing, or style, or that an earlier review thread on this PR already raised. Keep the ones you still can't settle as questions, unless the PR description already says the behavior is intended.
            3. Post each kept finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`, `commit_id: ${{ needs.gate.outputs.head }}`) on a RIGHT-side line inside a diff hunk, the closest one to the problem. For a bug: its severity, the scenario that breaks, and the fix; use a suggestion block only when committing it fixes the issue entirely. For a question: start with "Question:", then say what breaks if the assumption is wrong and what would confirm it. With no kept findings, post nothing.
            4. Rate how much care merging this PR needs, as its `merge` field: `easy` for docs, copy, styling, tests, internal tooling, or additive changes behind a flag, with no open findings; `careful` for login and auth, billing and payments, team roles and permissions, deleting data, CI workflows, or any open high-severity finding; `normal` for everything else. Put the deciding reason in one sentence in `reason`.
            5. In `fixed`, list the `id` of each unresolved thread in `review-threads.jsonl` started by `github-actions` whose problem the code at this commit no longer has. Leave out any you aren't sure of.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --json-schema '{"type":"object","properties":{"merge":{"type":"string","enum":["easy","normal","careful"]},"reason":{"type":"string"},"fixed":{"type":"array","items":{"type":"integer"}}},"required":["merge","reason","fixed"],"additionalProperties":false}'
            --add-dir ${{ runner.temp }}/pr
            --allowedTools "Bash,Agent,mcp__github_inline_comment__create_inline_comment"
            --agents '{"bug-finder":{"description":"Finds bugs a pull request introduces and reports them; posts nothing.","prompt":"You review a pull request by another author and report findings to the agent that asked. You cannot post to GitHub.","tools":["Read","Bash"],"model":"opus","effort":"high"}}'

  # Records a finished review in a job that runs no PR code, so the reviewer's shell never holds these permissions:
  # marks the reviewed commit, so the next push is reviewed from there; resolves the reviewer's own threads it judged
  # fixed (GitHub requires write access to the code for that); and labels the PR "merge: easy|normal|careful" (risk
  # tiers as in Anthropic's own review flow), with the reason in the job summary. The model's output is read as data.
  finish:
    name: Record the review
    needs: [gate, review]
    if: needs.review.outputs.result != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          HEAD: ${{ needs.gate.outputs.head }}
          OUT: ${{ needs.review.outputs.result }}
        run: |
          merge=$(jq -r .merge <<<"$OUT")
          case "$merge" in easy) color=0e8a16 ;; normal) color=fbca04 ;; careful) color=d93f0b ;; *) exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context="Claude review: reviewed" -f description="Reviewed this commit; merge: $merge" >/dev/null
          gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
              reviewThreads(last: 100) { nodes { id isResolved comments(first: 1) { nodes { databaseId author { login } } } } } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not) | select(.comments.nodes[0].author.login == "github-actions") | "\(.comments.nodes[0].databaseId) \(.id)"' > threads.txt
          for id in $(jq -r '.fixed[]' <<<"$OUT"); do
            thread=$(awk -v id="$id" '$1 == id { print $2 }' threads.txt)
            [ -n "$thread" ] || continue
            gh api graphql -f id="$thread" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id } } }' >/dev/null
            echo "Resolved fixed thread $id."
          done
          # A newer push has its own review, which sets the label for the newer commits.
          [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" = "$HEAD" ] || { echo "PR moved past $HEAD; not labeling." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/labels/merge:%20$merge" >/dev/null 2>&1 ||
            gh api "repos/$GITHUB_REPOSITORY/labels" -f name="merge: $merge" -f color=$color -f description="How much care merging this PR needs, rated by the Claude review" >/dev/null || true
          for old in easy normal careful; do
            [ "$old" = "$merge" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge:%20$old" >/dev/null 2>&1 || true
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=merge: $merge" >/dev/null
          # The label people add to ask for a full review again.
          gh api "repos/$GITHUB_REPOSITORY/labels/claude-review" >/dev/null 2>&1 ||
            gh api "repos/$GITHUB_REPOSITORY/labels" -f name=claude-review -f color=5319e7 -f description="Add to get a full Claude review again" >/dev/null || true
          { echo "**Merge: $merge**"; echo; jq -r .reason <<<"$OUT"; } >> "$GITHUB_STEP_SUMMARY"
