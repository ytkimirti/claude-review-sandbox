name: Claude Review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}. The repository is checked out with the PR applied. Read the PR with `gh pr view` (including `--comments`) and `gh pr diff`.

            1. Spawn a fresh subagent on Opus. Give it the full diff, the PR's goal from its title and description, and the conditions the change runs under (platforms, data shapes, missing config), not your reasoning. Present it as another author's work. Ask for bugs and slop this diff introduces. Each finding: file:line, the concrete input or scenario that breaks, severity, and a 0-100 confidence. Report only. "Nothing found" is a valid answer; never say bugs exist.
            2. Verify each finding yourself by reading the code. Keep bugs you can confirm by tracing a concrete input to the failure, and unconfirmed ones only if confidence is 80+ and you agree after reading the code. Drop pre-existing issues, nitpicks, and anything an earlier review comment on this PR already raised.
            3. Post each kept finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`) on the line it concerns: its severity, the scenario that breaks, and the fix. Use a suggestion block only when committing it fixes the issue entirely. With no kept findings, post nothing.
          claude_args: '--model claude-opus-5-5 --allowedTools "Read,Grep,Glob,Agent,Task,Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"'
